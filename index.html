<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bulut Cold Storage Facility - Professional cooling and storage solutions">
    <title>Bulut Cold Storage Facility</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }

        .logo {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: white;
            color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auto-redirect {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="bulut-logo-en.png" alt="Bulut Cold Storage" style="height: 75px; width: auto;">
        </div>
        <p>Professional Cooling & Storage Solutions</p>
        <p class="auto-redirect">
            Automatically redirecting based on your language...
            <span class="loader"></span>
        </p>
        <div class="buttons">
            <a href="tr/index.html" class="btn">🇹🇷 Türkçe</a>
            <a href="en/index.html" class="btn">🇬🇧 English</a>
        </div>
    </div>

    <script>
        // Auto-detect browser language and redirect
        (function() {
            const userLang = navigator.language || navigator.userLanguage;
            const lang = userLang.toLowerCase();

            // Redirect after 2 seconds
            setTimeout(function() {
                if (lang.startsWith('tr')) {
                    window.location.href = 'tr/index.html';
                } else {
                    window.location.href = 'en/index.html';
                }
            }, 2000);
        })();
    </script>
</body>
</html>
